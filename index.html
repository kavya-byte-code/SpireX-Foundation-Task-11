<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart | SpireX Foundation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Fresh Market</h1>
    <button class="cart-toggle" id="cartToggle" aria-label="Jump to cart">
      Cart <span class="badge" id="cartCount">0</span>
    </button>
  </header>

  <main class="layout">
    <section class="products" aria-labelledby="productsTitle">
      <h2 id="productsTitle">Products</h2>
      <div class="product-grid" id="productGrid"></div>
    </section>

    <aside class="cart" id="cartSection" aria-labelledby="cartTitle">
      <h2 id="cartTitle">Your cart</h2>
      <div id="cartItems" class="cart-items"></div>

      <div class="summary">
        <div class="row"><span>Subtotal</span><span id="subtotal">₹0.00</span></div>
        <div class="row"><span>GST (5%)</span><span id="tax">₹0.00</span></div>
        <div class="row total"><span>Total</span><span id="total">₹0.00</span></div>
      </div>

      <div class="actions">
        <button class="btn secondary" id="clearBtn">Clear cart</button>
        <button class="btn primary" id="checkoutBtn">Checkout</button>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
